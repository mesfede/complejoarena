<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18231c"/>
      <stop offset="100%" stop-color="#0e1511"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f99d"/>
      <stop offset="100%" stop-color="#c2f154"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#c2f154" stroke-width="12" stroke-opacity="0.3" />
  
  <!-- Crest / Shield Outline -->
  <path d="M 256 70 L 390 120 V 270 C 390 360 256 440 256 440 C 256 440 122 360 122 270 V 120 Z" fill="#223328" stroke="url(#limeGrad)" stroke-width="18" stroke-linejoin="round" />
  
  <!-- Stylized Monogram "CA" or Soccer Pattern in Shield -->
  <!-- Soccer Ball Pentagon Center -->
  <polygon points="256,180 286,202 274,238 238,238 226,202" fill="url(#limeGrad)" />
  <!-- Radiating seams -->
  <line x1="256" y1="180" x2="256" y2="135" stroke="url(#limeGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="286" y1="202" x2="328" y2="188" stroke="url(#limeGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="274" y1="238" x2="302" y2="275" stroke="url(#limeGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="238" y1="238" x2="210" y2="275" stroke="url(#limeGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="226" y1="202" x2="184" y2="188" stroke="url(#limeGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Bold Text "ARENA" / "CA" below -->
  <text x="256" y="365" font-family="'Teko', 'Barlow Condensed', sans-serif" font-weight="900" font-size="72" fill="#ffffff" text-anchor="middle" letter-spacing="4">ARENA</text>
  <text x="256" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#c2f154" text-anchor="middle" letter-spacing="6">CITY BELL</text>
</svg>
